name: Prepare and qualify audited test ablation
on:
  push:
    branches: [codex/test-ablation-prepare-20261004]
    paths: [.github/workflows/test-ablation-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: aaf73c8c421ceabb224c8743fd853b3a095ad716
      - name: Apply hash-bound audited deletions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          ops = [
            ('src/interpreter_v2/frame_layouts.zig','0f877b679e6a22f915e15a0df5e8ddd9a827a3a9','b7cb454172630a1a882dd23a0c4f8814d377e609',[(122,131)]),
            ('test/v2/stable_source.zig','ea0ed9e8b9a8a5fb0d41841c055879eed1dc2781','45159191e4528470c5c3ff90220141f336eb504f',[(1458,1479),(1601,1627),(1770,1790),(1956,1975)]),
          ]
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          for path, before, after, edits in ops:
              p = Path(path)
              data = p.read_bytes()
              assert blob(data) == before, path
              lines = data.decode().splitlines(keepends=True)
              for start, end in reversed(edits):
                  del lines[start:end]
              result = ''.join(lines).encode()
              assert blob(result) == after, path
              p.write_bytes(result)
          PY
          git add -u
          git diff --cached --check
          test "$(git write-tree)" = "c7f4ed12df54b602fa79e3f485203761fbe6188b"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Retire duplicated semantic examples and singleton layout snapshot'
          git push origin HEAD:refs/heads/codex/test-ablation-candidate-20261004
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.9.0'
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: '0.17.0'
          use-cache: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
      - name: Install qualified browser dependencies
        run: |
          npm ci --ignore-scripts --prefix test/current/browser-tools
          node test/current/browser-tools/node_modules/playwright-core/cli.js install-deps chromium firefox
      - name: Qualify the exact candidate through the public producer
        run: node bin/world.mjs runtime prepare --source "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/world-ablation"
      - name: Upload qualification evidence and transport
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: world-ablation-qualification
          path: |
            ${{ runner.temp }}/world-ablation.tar.gz
            ${{ runner.temp }}/world-ablation.delivery.json
            ${{ runner.temp }}/world-ablation/qualification.json
            ${{ runner.temp }}/world-ablation.preparing/bundle/evidence
            ${{ runner.temp }}/world-ablation.preparing/bundle/qualification.json
          retention-days: 7
          compression-level: 0
