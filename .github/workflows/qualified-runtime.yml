name: Qualified runtime bundle
on:
  push:
    branches: [codex/qualified-runtime-delivery]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.9.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Install browser test tools
        run: |
          npm ci --no-audit --no-fund --prefix test/current/browser-tools
          node test/current/browser-tools/node_modules/playwright-core/cli.js install chromium firefox
      - name: Prepare and verify the source-bound runtime
        run: |
          node bin/world.mjs runtime prepare --source "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/world-runtime-bundle"
          manifest_sha="$(shasum -a 256 "$RUNNER_TEMP/world-runtime-bundle/manifest.json" | cut -d ' ' -f 1)"
          node "$RUNNER_TEMP/world-runtime-bundle/runtime/bin/world.mjs" runtime verify --root "$RUNNER_TEMP/world-runtime-bundle" --manifest-sha256 "$manifest_sha" --smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: world-qualified-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/world-runtime-bundle.tar.gz
            ${{ runner.temp }}/world-runtime-bundle.runtime-delivery.json
          if-no-files-found: error
          retention-days: 30
